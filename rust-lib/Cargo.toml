[package]
name = "monero_wallet_backend"
version = "0.1.0"
edition = "2021"
description = "Logos monero_wallet_backend — Monero wallet coordinator."
rust-version = "1.89"

[workspace]
resolver = "3"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# No network crate: this module makes no HTTP of its own. It orchestrates the wallet core
# and the node module through their typed clients.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]

[dev-dependencies]
tempfile = "3"
