name: CI

# The nix half. unit-tests.yml runs the pure core under --no-default-features, which drops the
# logos_module feature and with it the SDK, the generated glue and both providers -- so without
# this file nothing here builds the module at all.


on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix build
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment; main jobs must opt into
    # it to publish to the public cache.
    environment: ${{ github.ref == 'refs/heads/main' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Build plugin and package
        # Two attributes because neither contains the other: `lgx` is the plugin plus the
        # packaging step, `default` is the same plugin plus the generated consumer API its
        # dependants compile against. Both rest on one expensive derivation, so the second is
        # nearly free.
        run: nix build -L .#lgx .#default
